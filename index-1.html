<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>نظام إدارة الأعمال</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--amber:#f2a900;--bg:#f3f4f6;--card:#fff;--text:#1b2433;--mute:#667085;--line:#e3e6ec;--ok:#0f9d6b;--bad:#d92d20;--info:#2563eb;--warn:#b54708;--brand:#14213d;--hover:#f8f9fb;--sh:0 1px 2px rgba(16,24,40,.06),0 8px 24px -12px rgba(16,24,40,.2);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1320;--card:#161f31;--text:#e6e9f0;--mute:#98a2b3;--line:#27324a;--brand:#f2c14e;--hover:#1b2740;--ok:#34d399;--bad:#f87171;--info:#60a5fa;--warn:#fbbf24}}
:root[data-theme=dark]{--bg:#0d1320;--card:#161f31;--text:#e6e9f0;--mute:#98a2b3;--line:#27324a;--brand:#f2c14e;--hover:#1b2740;--ok:#34d399;--bad:#f87171;--info:#60a5fa;--warn:#fbbf24}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100dvh}
.lg{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:20px}
.lc{background:var(--card);padding:36px 32px;border-radius:18px;width:100%;max-width:400px;display:grid;gap:16px;text-align:center}
.logo{width:68px;height:68px;border-radius:16px;background:var(--amber);display:grid;place-items:center;font-size:2rem;margin:0 auto}
.lc h1{color:var(--brand);font-size:1.5rem}.lc p{color:var(--mute);margin-top:-10px}
label{display:grid;gap:6px;font-weight:600;font-size:.92rem;text-align:right}
.in{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);font:inherit}
.in.sm{padding:4px 8px;font-size:.85rem;width:auto}
.in:focus,.btn:focus-visible,.nv:focus-visible{outline:3px solid rgba(37,99,235,.35);outline-offset:1px}
.btn{font:inherit;font-weight:600;border:0;border-radius:9px;padding:9px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.p{background:var(--amber);color:#14213d}.p:hover{filter:brightness(.95)}
.g{background:transparent;border:1px solid var(--line);color:var(--text)}
.d{background:var(--bad);color:#fff}.s{padding:4px 9px;font-size:.85rem}
.app{display:none}.app.on{display:block}
.sb{position:fixed;top:0;right:0;bottom:0;width:250px;background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:20px 14px;padding-top:calc(20px + env(safe-area-inset-top,0px));z-index:50;transition:transform .25s}
.brand{font-size:1.15rem;padding:4px 10px 18px;display:flex;gap:8px;align-items:center}
nav{flex:1;overflow:auto}
.nv{display:flex;gap:10px;width:100%;padding:11px 12px;border:0;border-radius:9px;background:none;color:#c9d1e3;font:inherit;cursor:pointer;text-align:right;margin-bottom:3px}
.nv:hover{background:rgba(255,255,255,.08)}.nv.on{background:rgba(242,169,0,.16);color:#fff;box-shadow:inset -3px 0 var(--amber)}
.me{padding:12px 10px 4px;border-top:1px solid rgba(255,255,255,.12);font-size:.85rem;color:#c9d1e3}
main{margin-right:250px;padding:26px 30px;max-width:1200px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}.top h2{color:var(--brand);font-size:1.5rem}.bg{display:none}
.bar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}.bar .in{flex:1;min-width:180px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--hover);color:var(--mute);font-size:.85rem;font-weight:600}tbody tr:hover{background:var(--hover)}tr:last-child td{border-bottom:0}
td.ac{display:flex;gap:6px}.em{text-align:center;color:var(--mute);padding:36px!important;white-space:normal}
.b{--c:var(--info);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);padding:3px 11px;border-radius:20px;font-size:.82rem;font-weight:600}
.b.ok{--c:var(--ok)}.b.bad{--c:var(--bad)}.b.warn{--c:var(--warn)}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:14px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--sh)}
.sc b{display:block;font-size:1.6rem;line-height:1.3}.sc span{color:var(--mute);font-size:.9rem}
.sc.hi{background:var(--ink);color:#fff;border-color:var(--ink)}.sc.hi span{color:#c9d1e3}.sc.hi b{color:var(--amber)}
.h3{margin:22px 0 10px;color:var(--brand)}
.act{list-style:none;background:var(--card);border:1px solid var(--line);border-radius:12px}
.act li{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}.act li:last-child{border:0}.act small{color:var(--mute)}
.md{position:fixed;inset:0;background:rgba(10,15,30,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}.md.on{display:flex}
.mc{background:var(--card);border-radius:16px;width:100%;max-width:640px;max-height:90dvh;overflow:auto;padding:22px}
.mc h3{color:var(--brand);margin-bottom:16px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fg .w{grid-column:1/-1}.row{display:flex;gap:10px;margin-top:8px}
dl{display:grid;grid-template-columns:130px 1fr;gap:8px 14px}dt{color:var(--mute)}dd{white-space:pre-wrap}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:8px 0 14px}.gal img{width:100%;height:100px;object-fit:cover;border-radius:8px}
small{color:var(--mute)}
#toasts{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:18px;display:grid;gap:8px;z-index:300}
.toast{background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;border-right:4px solid var(--ok);box-shadow:var(--sh)}.toast.err{border-color:var(--bad)}
@media(max-width:820px){.sb{transform:translateX(100%)}.sb.open{transform:none}main{margin:0;padding:16px}.bg{display:inline-flex}.fg{grid-template-columns:1fr}.menu-pad{padding-top:6px}}
@media print{.sb,.bar,.bg,td.ac,th:last-child{display:none!important}main{margin:0}}
.fr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.fn{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fn:hover{text-decoration:underline}
</style>
</head>
<body>
<div id="lg" class="lg"><form id="lf" class="lc"><div class="logo">🏗️</div><h1>نظام إدارة الأعمال</h1><p>سجّل الدخول للمتابعة</p>
<label>اسم المستخدم<input id="u" class="in" required autocomplete="username"></label>
<label>كلمة المرور<input id="p" type="password" class="in" required autocomplete="current-password"></label>
<button class="btn p" style="width:100%;justify-content:center">دخول</button></form></div>
<div id="app" class="app"><aside id="sb" class="sb"><div class="brand">🏗️ <b>إدارة الأعمال</b></div><nav id="nav"></nav><div class="me" id="me"></div></aside>
<main><header class="top"><button class="btn g bg" onclick="$('#sb').classList.toggle('open')" aria-label="القائمة">☰</button><h2 id="ttl"></h2></header><div id="view"></div></main></div>
<div id="md" class="md"><div id="mc" class="mc"></div></div><div id="toasts"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={pending:'قيد الانتظار',inprogress:'قيد التنفيذ',completed:'مكتمل'};
const BC={income:'ok',expense:'bad',low:'ok',medium:'',high:'warn',urgent:'bad',emergency:'bad'};
// تعريف الأقسام: f = الحقول [المفتاح، التسمية، النوع، مطلوب، خيارات] — c = أعمدة الجدول
const E={
clients:{t:'العملاء',i:'👥',n:'عميل جديد',f:[['name','الاسم','text',1],['phone','الهاتف','tel',1],['email','البريد الإلكتروني','email'],['address','العنوان','text'],['mapUrl','رابط الموقع (الصق من خرائط جوجل)','url'],['notes','ملاحظات','area'],['files','المرفقات','files']],c:['name','phone','email','address','map']},
projects:{t:'الإنشاءات',i:'🏗️',n:'مشروع جديد',st:1,f:[['clientId','العميل','client',1],['type','النوع','sel',1,{construction:'إنشاءات',installation:'تركيبات',renovation:'تجديد',other:'أخرى'}],['startDate','تاريخ البدء','date',1],['endDate','تاريخ الانتهاء','date'],['description','الوصف','area'],['before','صور قبل التنفيذ','img'],['after','صور بعد التنفيذ','img']],c:['clientId','type','startDate','status','imgs']},
maintenance:{t:'الصيانة',i:'🛠️',n:'طلب صيانة',st:1,f:[['clientId','العميل','client',1],['type','النوع','sel',1,{preventive:'وقائية',corrective:'علاجية',emergency:'طارئة'}],['priority','الأولوية','sel',1,{low:'منخفضة',medium:'متوسطة',high:'عالية',urgent:'عاجلة'}],['date','التاريخ','date',1],['description','الوصف','area']],c:['clientId','type','priority','date','status']},
finance:{t:'المالية',i:'💰',n:'سجل مالي',f:[['type','النوع','sel',1,{income:'إيراد',expense:'مصروف'}],['amount','المبلغ (جنيه)','number',1],['clientId','العميل','client'],['date','التاريخ','date',1],['description','الوصف','text'],['invoice','صورة الفاتورة','img']],c:['date','type','amount','clientId','description','imgs']},
aftersales:{t:'ما بعد البيع',i:'🎧',n:'متابعة جديدة',f:[['clientId','العميل','client',1],['date','تاريخ المتابعة','date',1],['contactType','نوع التواصل','sel',0,{call:'اتصال',visit:'زيارة',email:'بريد'}],['rating','التقييم','sel',0,{5:'ممتاز',4:'جيد جداً',3:'جيد',2:'مقبول',1:'ضعيف'}],['notes','ملاحظات','area']],c:['clientId','date','contactType','rating','notes']},
users:{t:'المستخدمون',i:'⚙️',n:'مستخدم جديد',adm:1,f:[['username','اسم المستخدم','text',1],['pass','كلمة المرور','pw'],['role','الدور','sel',1,{user:'مستخدم',admin:'مدير'}]],c:['username','role','createdAt']}};
const D={};let me=null,cur='dashboard';
const KEYS=[...Object.keys(E),'activities'];
const load=()=>KEYS.forEach(k=>{try{D[k]=JSON.parse(localStorage.getItem(k))||[]}catch(e){D[k]=[]}});
const save=k=>{try{localStorage.setItem(k,JSON.stringify(D[k]))}catch(e){toast('مساحة التخزين ممتلئة — استخدم صوراً أقل','err')}};
const hash=async s=>!(window.crypto&&crypto.subtle)?'x'+[...s].reduce((h,c)=>(h*33^c.charCodeAt(0))>>>0,5381).toString(16):[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function toast(m,t){const e=document.createElement('div');e.className='toast '+(t||'');e.textContent=m;$('#toasts').append(e);setTimeout(()=>e.remove(),3000)}
function log(text){D.activities.unshift({text,date:new Date().toISOString()});D.activities=D.activities.slice(0,50);save('activities')}
const mapHref=c=>{const u=(c.mapUrl||'').trim();if(/^https?:\/\//i.test(u))return u;return c.address?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c.address):''};
const cn=id=>D.clients.find(c=>c.id==id)?.name||'—';
const opts=(m,s)=>Object.entries(m).map(([a,b])=>`<option value="${a}"${a==s?' selected':''}>${b}</option>`).join('');
const sum=t=>D.finance.filter(f=>f.type===t).reduce((a,f)=>a+(+f.amount||0),0);
const fm=n=>n.toLocaleString('ar-EG')+' جنيه';
const fld=(en,k)=>E[en].f.find(x=>x[0]===k);
function cell(en,k,r){const v=r[k],f=fld(en,k),t=f?f[2]:'';
 if(k==='map'){const h=mapHref(r);return h?`<a class="btn g s" href="${esc(h)}" target="_blank" rel="noopener">📍 فتح</a>`:'—'}
 if(k==='status')return`<select class="in sm" onchange="setSt('${en}',${r.id},this.value)">${opts(ST,v||'pending')}</select>`;
 if(k==='imgs')return(n=>n?`<span class="b">📷 ${n}</span>`:'—')(['before','after','invoice'].reduce((a,x)=>a+(r[x]?.length||0),0));
 if(t==='client')return esc(cn(v));
 if(t==='sel'){const l=esc(f[4][v]||v);return v in BC?`<span class="b ${BC[v]}">${l}</span>`:l}
 if(t==='img')return v?.length?`<span class="b">📷 ${v.length}</span>`:'—';
 if(t==='date'||k==='createdAt')return v?new Date(v).toLocaleDateString('ar-EG'):'—';
 if(k==='amount')return fm(+v);
 return esc(v)||'—'}
const lbl=(en,k)=>k==='map'?'الموقع':k==='status'?'الحالة':k==='imgs'?'الصور':k==='createdAt'?'تاريخ الإنشاء':fld(en,k)[1];
function show(k){cur=k;$$('.nv').forEach(b=>b.classList.toggle('on',b.dataset.k===k));$('#sb').classList.remove('open');
 $('#ttl').textContent=k==='dashboard'?'لوحة التحكم':E[k].t;k==='dashboard'?dash():list(k)}
function dash(){const inc=sum('income'),exp=sum('expense'),pr=D.projects;
 $('#view').innerHTML=`<div class="st">${[['العملاء',D.clients.length],['مشاريع جارية',pr.filter(p=>p.status!=='completed').length],['مشاريع مكتملة',pr.filter(p=>p.status==='completed').length],['صيانة مفتوحة',D.maintenance.filter(m=>m.status!=='completed').length]].map(([l,n])=>`<div class="sc"><b>${n}</b><span>${l}</span></div>`).join('')}</div>
 <div class="st"><div class="sc"><b>${fm(inc)}</b><span>الإيرادات</span></div><div class="sc"><b>${fm(exp)}</b><span>المصروفات</span></div><div class="sc hi"><b>${fm(inc-exp)}</b><span>صافي الربح</span></div></div>
 <h3 class="h3">آخر النشاطات</h3><ul class="act">${D.activities.slice(0,8).map(a=>`<li><span>${esc(a.text)}</span><small>${new Date(a.date).toLocaleString('ar-EG')}</small></li>`).join('')||'<li class="em">لا توجد نشاطات بعد</li>'}</ul>`}
function list(en){const c=E[en];
 $('#view').innerHTML=`${en==='finance'?`<div class="st"><div class="sc"><b>${fm(sum('income'))}</b><span>إيرادات</span></div><div class="sc"><b>${fm(sum('expense'))}</b><span>مصروفات</span></div></div>`:''}
 <div class="bar"><input id="q" class="in" type="search" placeholder="بحث..." oninput="rows('${en}')"><button class="btn p" onclick="edit('${en}')">＋ ${c.n}</button></div>
 <div class="tw"><table><thead><tr>${c.c.map(k=>`<th>${lbl(en,k)}</th>`).join('')}<th>إجراءات</th></tr></thead><tbody id="tb"></tbody></table></div>`;rows(en)}
function rows(en){const c=E[en],q=($('#q')?.value||'').trim().toLowerCase();
 const rs=D[en].filter(r=>!q||(c.f.filter(f=>!['img','pw','files'].includes(f[2])).map(f=>f[2]==='client'?cn(r[f[0]]):r[f[0]]).join(' ')).toLowerCase().includes(q));
 $('#tb').innerHTML=rs.map(r=>`<tr>${c.c.map(k=>`<td>${cell(en,k,r)}</td>`).join('')}<td class="ac"><button class="btn g s" title="تفاصيل" onclick="info('${en}',${r.id})">👁</button><button class="btn g s" title="تعديل" onclick="edit('${en}',${r.id})">✏️</button>${me.role==='admin'?`<button class="btn d s" title="حذف" onclick="del('${en}',${r.id})">🗑</button>`:''}</td></tr>`).join('')||`<tr><td colspan="9" class="em">${q?'لا نتائج مطابقة':`لا توجد سجلات بعد — اضغط «${c.n}» للبدء`}</td></tr>`}
function info(en,id){const c=E[en],r=D[en].find(x=>x.id===id);
 $('#mc').innerHTML=`<h3>التفاصيل</h3><dl>${c.f.filter(f=>!['img','pw','files'].includes(f[2])).map(f=>`<dt>${f[1]}</dt><dd>${cell(en,f[0],r)}</dd>`).join('')}${c.st?`<dt>الحالة</dt><dd>${ST[r.status||'pending']}</dd>`:''}</dl>
 ${c.f.filter(f=>f[2]==='img'&&r[f[0]]?.length).map(f=>`<h4>${f[1]}</h4><div class="gal">${r[f[0]].map(s=>`<img src="${s}" alt="" onclick="zoom(this.src)" style="cursor:zoom-in">`).join('')}</div>`).join('')}
 <div class="row"><button class="btn g" onclick="closeM()">إغلاق</button></div>`;$('#md').classList.add('on')}
const fi=(k,t,rq,o,v)=>{const a=`name="${k}"${rq?' required':''} class="in"`;
 if(t==='area')return`<textarea ${a} rows="3">${esc(v)}</textarea>`;
 if(t==='sel')return`<select ${a}>${opts(o,v)}</select>`;
 if(t==='client')return`<select ${a}><option value="">${rq?'اختر العميل':'عام'}</option>${D.clients.map(c=>`<option value="${c.id}"${c.id==v?' selected':''}>${esc(c.name)}</option>`).join('')}</select>`;
 if(t==='files')return`<div class="row" style="flex-wrap:wrap">${[['img','🖼️ صور'],['doc','📄 مستندات'],['pdf','📕 PDF']].map(([x,l])=>`<button type="button" class="btn g" onclick="pick('${x}',addPend)">${l}</button>`).join('')}</div><div id="pl"></div>${v?.length?`<small>${v.length} مرفق محفوظ — الجديدة تُضاف إليها</small>`:''}`;
 if(t==='img')return`<input ${a} type="file" accept="image/*" multiple>${v?.length?`<small>${v.length} صورة محفوظة — اختيار صور جديدة يستبدلها</small>`:''}`;
 if(t==='pw')return`<input name="${k}" class="in" type="password" autocomplete="new-password"${v?' placeholder="اتركها فارغة للإبقاء على الحالية"':' required'}>`;
 return`<input ${a} type="${t}" value="${esc(v)}">`};
const pack=f=>new Promise(res=>{const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};im.onerror=()=>res('');im.src=e.target.result};r.readAsDataURL(f)});
function edit(en,id){pend=[];const c=E[en],r=D[en].find(x=>x.id===id)||{};
 $('#mc').innerHTML=`<h3>${id?'تعديل':c.n}</h3><form id="fm" class="fg">${c.f.map(([k,l,t,rq,o])=>`<${t==='files'?'div':'label'} class="${['area','img','files'].includes(t)?'w':''}">${l}${rq?' *':''}${fi(k,t,rq,o,r[k])}</${t==='files'?'div':'label'}>`).join('')}<div class="w row"><button class="btn p">حفظ</button><button type="button" class="btn g" onclick="closeM()">إلغاء</button></div></form>`;
 $('#md').classList.add('on');
 $('#fm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),o=id?r:{id:Date.now(),createdAt:new Date().toISOString(),status:'pending'};
  for(const [k,,t] of c.f){
   if(t==='img'){const fs=[...e.target[k].files];if(fs.length)o[k]=(await Promise.all(fs.map(pack))).filter(Boolean)}
   else if(t==='files')await attach(o,pend);
   else if(t==='pw'){const v=fd.get(k);if(v)o[k]=await hash(v)}
   else o[k]=t==='number'?+fd.get(k):String(fd.get(k)||'').trim()}
  if(en==='users'&&D.users.some(u=>u.username===o.username&&u.id!==o.id))return toast('اسم المستخدم مستخدم بالفعل','err');
  if(!id)D[en].push(o);save(en);log((id?'تعديل: ':'إضافة: ')+c.t);closeM();show(cur);toast('تم الحفظ');if(en==='clients')profile(o.id)}}
function setSt(en,id,v){const r=D[en].find(x=>x.id===id);r.status=v;save(en);log('تحديث الحالة إلى «'+ST[v]+'»');toast('تم تحديث الحالة')}
function del(en,id){if(en==='users'&&id===me.id)return toast('لا يمكن حذف حسابك الحالي','err');
 ask('هل أنت متأكد من الحذف؟ لا يمكن التراجع.',()=>{(D[en].find(x=>x.id===id)?.files||[]).forEach(f=>fdel(f.id).catch(()=>0));D[en]=D[en].filter(x=>x.id!==id);save(en);log('حذف: '+E[en].t);closeM();show(cur);toast('تم الحذف')})}
function closeM(){$('#md').classList.remove('on')}
$('#md').onclick=e=>{if(e.target.id==='md')closeM()};document.onkeydown=e=>{if(e.key==='Escape')closeM()};
function theme(){const d=document.documentElement,dk=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches,t=dk?'light':'dark';d.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}}
function logout(){try{localStorage.removeItem('sess')}catch(e){}location.reload()}
function start(){$('#lg').style.display='none';$('#app').classList.add('on');
 $('#nav').innerHTML=[['dashboard','🏠','الرئيسية'],...Object.entries(E).filter(([k,v])=>!v.adm||me.role==='admin').map(([k,v])=>[k,v.i,v.t])].map(([k,i,t])=>`<button class="nv" data-k="${k}" onclick="show('${k}')">${i} ${t}</button>`).join('')+`<button class="nv" onclick="theme()">🌓 الوضع الليلي</button><button class="nv" onclick="logout()">🚪 تسجيل الخروج</button>`;
 $('#me').textContent=me.username+' — '+(me.role==='admin'?'مدير':'مستخدم');show('dashboard')}
$('#lf').onsubmit=async e=>{e.preventDefault();const u=$('#u').value.trim(),h=await hash($('#p').value),x=D.users.find(x=>x.username===u&&x.pass===h);
 if(!x)return toast('اسم المستخدم أو كلمة المرور غير صحيحة','err');me=x;try{localStorage.setItem('sess',x.id)}catch(e){}log('تسجيل دخول: '+u);start()};
(async()=>{load();
 if(!D.users.length){const t=new Date().toISOString();D.users=[{id:1,username:'admin',pass:await hash('admin'),role:'admin',createdAt:t},{id:2,username:'user',pass:await hash('user'),role:'user',createdAt:t}];save('users')}
 try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;me=D.users.find(u=>String(u.id)===localStorage.getItem('sess'))}catch(e){}
 if(me)start()})();

async function attach(o,fs){o.files=o.files||[];for(const f of fs){if(f.size>15e6){toast(f.name+' أكبر من 15 م.ب','err');continue}const fid='f'+Date.now()+Math.random().toString(36).slice(2,6);try{await fput(fid,f);o.files.push({id:fid,name:f.name,type:f.type||'',size:f.size,date:new Date().toISOString()})}catch(e){toast('تعذّر حفظ '+f.name+' — المساحة ممتلئة','err')}}}
let pend=[];
const ACC={img:'image/*',doc:'.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.rtf,.odt',pdf:'application/pdf,.pdf'};
function pick(kind,cb){const i=document.createElement('input');i.type='file';i.multiple=true;i.accept=ACC[kind];i.style.display='none';i.onchange=()=>{cb([...i.files]);i.remove()};document.body.append(i);i.click()}
function showPend(){const e=$('#pl');if(e)e.innerHTML=pend.map((f,i)=>`<div class="fr"><span class="fn">${ico(f.type||'')} ${esc(f.name)}</span><small>${Math.max(1,Math.round(f.size/1024))} ك.ب</small><button type="button" class="btn d s" onclick="pend.splice(${i},1);showPend()">✕</button></div>`).join('')}
const addPend=fs=>{pend.push(...fs);showPend()};
// ===== مرفقات العملاء (تُحفظ في IndexedDB) =====
const toURL=b=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(b)});
const toBlob=d=>{const [h,b]=d.split(','),t=(h.match(/:(.*?);/)||[])[1]||'',a=atob(b),u=new Uint8Array(a.length);for(let i=0;i<a.length;i++)u[i]=a.charCodeAt(i);return new Blob([u],{type:t})};
const TO=(p,ms=2500)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),ms))]);
let idb;try{idb=new Promise((ok,no)=>{const r=indexedDB.open('bizfiles',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}catch(e){idb=Promise.reject(e)}
idb.catch(()=>0);
const tx=async(m,fn)=>{const d=await idb;return new Promise((ok,no)=>{const t=d.transaction('f',m),q=fn(t.objectStore('f'));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})};
async function fput(id,b){try{await TO(tx('readwrite',s=>s.put(b,id)))}catch(e){localStorage.setItem('file:'+id,await toURL(b))}}
async function fget(id){const d=localStorage.getItem('file:'+id);if(d)return toBlob(d);return TO(tx('readonly',s=>s.get(id)))}
const fdel=id=>{try{localStorage.removeItem('file:'+id)}catch(e){}return TO(tx('readwrite',s=>s.delete(id))).catch(()=>0)};
addEventListener('error',e=>toast('خطأ: '+e.message,'err'));
const ico=t=>t.startsWith('image/')?'🖼️':t==='application/pdf'?'📕':'📄';
function ask(m,yes,no){$('#mc').innerHTML=`<h3>${m}</h3><div class="row"><button class="btn d" id="y">حذف</button><button class="btn g" id="n">إلغاء</button></div>`;$('#md').classList.add('on');$('#y').onclick=yes;$('#n').onclick=no||closeM}
function zoom(src){$('#mc').innerHTML=`<img src="${src}" alt="" style="width:100%;border-radius:10px"><div class="row"><button class="btn g" onclick="closeM()">إغلاق</button></div>`;$('#md').classList.add('on')}
function profile(id){const c=D.clients.find(x=>x.id===id),f=k=>c[k]?esc(c[k]):'—',
 pj=D.projects.filter(p=>p.clientId==id).length,mt=D.maintenance.filter(m=>m.clientId==id).length,
 pay=D.finance.filter(x=>x.clientId==id&&x.type==='income').reduce((a,x)=>a+(+x.amount||0),0);
 $('#mc').innerHTML=`<h3>ملف العميل: ${esc(c.name)}</h3>
 <dl><dt>الهاتف</dt><dd>${f('phone')}</dd><dt>البريد</dt><dd>${f('email')}</dd><dt>العنوان</dt><dd>${f('address')}</dd><dt>الموقع</dt><dd>${cell('clients','map',c)}</dd><dt>ملاحظات</dt><dd>${f('notes')}</dd>
 <dt>المشاريع</dt><dd>${pj}</dd><dt>طلبات الصيانة</dt><dd>${mt}</dd><dt>إجمالي المدفوعات</dt><dd>${fm(pay)}</dd></dl>
 <div class="row"><button class="btn p" onclick="edit('clients',${id})">✏️ تعديل البيانات</button></div>
 <h4 class="h3">المرفقات</h4><div id="fl"></div>
 <div class="row" style="flex-wrap:wrap">${[['img','🖼️ صور'],['doc','📄 مستندات'],['pdf','📕 PDF']].map(([x,l])=>`<button type="button" class="btn g" onclick="pick('${x}',fs=>addFiles(${id},fs))">${l}</button>`).join('')}</div>
 <div class="row"><button class="btn g" onclick="closeM()">إغلاق</button></div>`;
 $('#md').classList.add('on');files(id)}
function files(id){const c=D.clients.find(x=>x.id===id);
 $('#fl').innerHTML=(c.files||[]).map(f=>`<div class="fr"><span class="fn" onclick="openF(${id},'${f.id}')">${ico(f.type)} ${esc(f.name)}</span><small>${Math.max(1,Math.round(f.size/1024))} ك.ب</small><button class="btn g s" onclick="openF(${id},'${f.id}')">فتح</button>${me.role==='admin'?`<button class="btn d s" onclick="delF(${id},'${f.id}')">🗑</button>`:''}</div>`).join('')||'<small>لا توجد مرفقات بعد</small>'}
async function addFiles(id,fs){const c=D.clients.find(x=>x.id===id);c.files=c.files||[];
 for(const f of fs){if(f.size>15e6){toast(f.name+' أكبر من 15 م.ب','err');continue}
  const fid='f'+Date.now()+Math.random().toString(36).slice(2,6);
  try{await fput(fid,f);c.files.push({id:fid,name:f.name,type:f.type||'',size:f.size,date:new Date().toISOString()})}catch(e){toast('تعذّر حفظ '+f.name+' — الملف كبير أو المساحة ممتلئة','err')}}
 save('clients');log('مرفقات جديدة: '+c.name);files(id);toast('تمت إضافة المرفقات')}
async function openF(cid,fid){const c=D.clients.find(x=>x.id===cid),m=c.files.find(f=>f.id===fid);let b;try{b=await fget(fid)}catch(e){}
 if(!b)return toast('الملف غير موجود','err');const u=await toURL(b),t=m.type;
 $('#mc').innerHTML=`<h3>${esc(m.name)}</h3>${t.startsWith('image/')?`<img src="${u}" alt="" style="width:100%;border-radius:10px">`:t==='application/pdf'?`<iframe src="${u}" style="width:100%;height:65dvh;border:0;border-radius:10px"></iframe>`:t.startsWith('text/')?'<pre id="tx" style="white-space:pre-wrap"></pre>':'<p class="em">لا توجد معاينة لهذا النوع من الملفات.</p>'}
 <div class="row"><a class="btn p" href="${u}" download="${esc(m.name)}" target="_blank">⬇ تنزيل / فتح في تبويب</a><button class="btn g" onclick="profile(${cid})">رجوع</button></div>`;
 $('#md').classList.add('on');if(t.startsWith('text/'))b.text().then(x=>$('#tx').textContent=x)}
function delF(cid,fid){ask('حذف هذا المرفق؟',()=>{const c=D.clients.find(x=>x.id===cid);c.files=c.files.filter(f=>f.id!==fid);save('clients');fdel(fid).catch(()=>0);profile(cid);toast('تم حذف المرفق')},()=>profile(cid))}
const _info=info;info=function(en,id){if(en==='clients')return profile(id);_info(en,id);$('#mc .row').insertAdjacentHTML('afterbegin',`<button class="btn p" onclick="edit('${en}',${id})">✏️ تعديل</button>`)};
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>0));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
</body>
